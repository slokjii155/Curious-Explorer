<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#050816">

<title>
Visual Chemistry Explorer
</title>

</head>


<body>


<!-- =====================
     TOP TOOLBAR
===================== -->


<div id="topBar">


<div class="title">

⚛ Visual Chemistry Explorer

</div>



<select
id="modelSelect"
class="toolbarSelect"
>


<option value="bohr">

⚛ Bohr Model

</option>


<option value="quantum">

☁ Quantum Orbital Model

</option>


</select>





<select
id="elementSelect"
class="toolbarSelect"
>


<option value="">

Select Element

</option>


</select>



</div>





<!-- =====================
     WELCOME SCREEN
===================== -->


<div id="welcomeScreen">


<div class="welcome-orb orb1"></div>

<div class="welcome-orb orb2"></div>

<div class="welcome-orb orb3"></div>




<div class="welcome-icon">

⚛

</div>




<h1>

Welcome to

<span>

Visual Chemistry Explorer

</span>

</h1>




<p>

Select an element to explore its atomic structure

</p>



</div>






<!-- =====================
     PROPERTIES PANEL
===================== -->


<div

id="propertiesPanel"

class="properties-panel"

style="display:none"

>


</div>


<!-- =====================
     PANEL SHOW/HIDE TOGGLE
===================== -->

<button

id="panelToggleBtn"

class="panel-toggle-btn"

style="display:none"

type="button"

aria-label="Show or hide the atom details panel"

aria-pressed="true"

>

<span class="toggle-icon">⟩</span>

</button>


<!-- =====================
     ELECTRON SPEED CONTROL
     (own floating widget, bottom-left — easy thumb
     reach on phones, mirrors the panel toggle on the
     opposite corner, and can be tucked away the same way)
===================== -->

<div

id="speedPanel"

class="speed-panel"

>

<label for="speedSlider">⚡ Electron Speed</label>

<input

id="speedSlider"

type="range"

min="0.2"

max="3"

step="0.1"

value="1"

/>

</div>

<button

id="speedToggleBtn"

class="speed-toggle-btn"

type="button"

aria-label="Show or hide the electron speed control"

aria-pressed="true"

>

<span class="toggle-icon">⚡</span>

</button>






<script

type="module"

src="./js/main.js">

</script>


</body>


</html>
