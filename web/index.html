<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#050508">

<title>Explorer</title>

<style>

:root{
    --royal-black:#050508;
    --glass:rgba(255,255,255,.05);
    --glass-strong:rgba(255,255,255,.09);
    --glass-border:rgba(255,255,255,.14);
    --lavender:#b9a6ff;
    --lavender-soft:#d9cfff;
    --lavender-glow:rgba(185,166,255,.35);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    height:100dvh;
    overflow:hidden;
    overscroll-behavior:none;
    background:var(--royal-black);
}

body{
    font-family:"Segoe UI", Arial, sans-serif;
    color:#fff;
    position:relative;

    padding:
    max(20px, env(safe-area-inset-top))
    max(20px, env(safe-area-inset-right))
    max(20px, env(safe-area-inset-bottom))
    max(20px, env(safe-area-inset-left));
}

#bgCanvas{
    position:fixed;
    inset:0;
    z-index:0;
    display:block;
}

/* soft dark vignette so text stays readable over the 3D scene */
.vignette{
    position:fixed;
    inset:0;
    z-index:1;
    pointer-events:none;
    background:
    radial-gradient(circle at 50% 38%, transparent 0%, rgba(5,5,8,.35) 60%, rgba(5,5,8,.85) 100%);
}

.page{
    position:relative;
    z-index:2;

    width:100%;
    height:100%;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:56px;

    text-align:center;
}

/* ===================== HERO ===================== */

.brand{
    font-size:15px;
    font-weight:600;
    letter-spacing:6px;
    text-transform:uppercase;
    color:var(--lavender-soft);
    text-shadow:0 0 18px var(--lavender-glow);
    margin-bottom:14px;
}

.headline{
    font-size:clamp(32px, 5vw, 56px);
    font-weight:700;
    letter-spacing:.5px;
    line-height:1.15;

    background:linear-gradient(135deg, #ffffff 0%, var(--lavender-soft) 55%, var(--lavender) 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;

    filter:drop-shadow(0 2px 20px rgba(185,166,255,.2));
}

.subline{
    margin-top:16px;
    font-size:16px;
    color:rgba(255,255,255,.65);
    max-width:520px;
    margin-left:auto;
    margin-right:auto;
    line-height:1.6;
}

/* ===================== SUBJECT CARDS ===================== */

.subjects{
    display:flex;
    gap:22px;
    flex-wrap:wrap;
    justify-content:center;
}

.subject-card{
    position:relative;

    width:220px;
    padding:34px 24px;

    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;

    text-decoration:none;
    color:#fff;

    background:linear-gradient(160deg, var(--glass-strong), var(--glass));
    backdrop-filter:blur(22px) saturate(160%);
    -webkit-backdrop-filter:blur(22px) saturate(160%);

    border:1px solid var(--glass-border);
    border-radius:22px;

    box-shadow:
    0 14px 40px rgba(0,0,0,.5),
    inset 0 1px 1px rgba(255,255,255,.12);

    cursor:pointer;

    transition:transform .35s cubic-bezier(.4,0,.2,1), box-shadow .35s ease, border-color .35s ease;
}

.subject-card:hover,
.subject-card:focus-visible{
    transform:translateY(-6px);
    border-color:rgba(185,166,255,.55);
    box-shadow:
    0 22px 55px rgba(0,0,0,.55),
    0 0 40px var(--lavender-glow),
    inset 0 1px 1px rgba(255,255,255,.18);
    outline:none;
}

.subject-icon{
    font-size:34px;
    filter:drop-shadow(0 0 12px var(--lavender-glow));
}

.subject-name{
    font-size:19px;
    font-weight:700;
    letter-spacing:.3px;
}

.badge{
    margin-top:6px;
    padding:6px 16px;
    border-radius:999px;
    font-size:11.5px;
    font-weight:600;
    letter-spacing:.4px;
}

.badge.soon{
    color:rgba(255,255,255,.55);
    border:1px solid rgba(255,255,255,.18);
    background:rgba(255,255,255,.03);
}

.badge.go{
    color:#0a0a12;
    background:linear-gradient(135deg, var(--lavender-soft), var(--lavender));
    box-shadow:0 0 22px var(--lavender-glow);
}

/* ===================== "COMING SOON" OVERLAY ===================== */

.soon-overlay{
    position:fixed;
    inset:0;
    z-index:40;

    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;

    background:rgba(5,5,8,.6);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);

    opacity:0;
    pointer-events:none;
    transition:opacity .3s ease;
}

.soon-overlay.show{
    opacity:1;
    pointer-events:auto;
}

.soon-card{
    position:relative;
    width:min(90vw, 340px);
    padding:38px 28px;
    text-align:center;

    background:linear-gradient(160deg, var(--glass-strong), var(--glass));
    backdrop-filter:blur(24px) saturate(160%);
    -webkit-backdrop-filter:blur(24px) saturate(160%);

    border:1px solid var(--glass-border);
    border-radius:24px;

    box-shadow:0 24px 60px rgba(0,0,0,.6), 0 0 40px var(--lavender-glow);
}

.soon-card h3{
    font-size:22px;
    margin-bottom:10px;
    background:linear-gradient(135deg, #fff 0%, var(--lavender-soft) 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}

.soon-card p{
    font-size:14px;
    color:rgba(255,255,255,.6);
    line-height:1.6;
}

.soon-close{
    position:absolute;
    top:14px;
    right:14px;

    width:30px;
    height:30px;
    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:rgba(255,255,255,.06);
    border:1px solid var(--glass-border);
    color:#fff;
    cursor:pointer;
    font-size:13px;
}

/* ===================== RESPONSIVE ===================== */

@media(max-width:768px){

    .page{ gap:40px; }

    .brand{ letter-spacing:4px; font-size:13px; }

    .subline{ font-size:14px; padding:0 8px; }

    .subjects{
        flex-direction:column;
        align-items:center;
        width:100%;
        gap:14px;
    }

    .subject-card{
        width:min(86vw, 340px);
        padding:22px 22px;
        flex-direction:row;
        justify-content:flex-start;
        gap:16px;
        text-align:left;
    }

    .subject-name{ font-size:17px; }

    .badge{ margin-top:0; margin-left:auto; }

}

</style>

</head>


<body>

<canvas id="bgCanvas"></canvas>
<div class="vignette"></div>

<div class="page">

    <header class="hero">

        <div class="brand">Explorer</div>

        <h1 class="headline">Explore. Visualize. Understand.</h1>

        <p class="subline">
        An immersive way to learn Physics, Chemistry and Mathematics — interactive, visual, and built to explore.
        </p>

    </header>

    <main class="subjects">

        <a class="subject-card" data-subject="physics" data-soon href="#" tabindex="0">
            <div class="subject-icon">🪐</div>
            <div class="subject-name">Physics</div>
            <div class="badge soon">Coming Soon</div>
        </a>

        <a class="subject-card" data-subject="chemistry" href="./chemistry.html" tabindex="0">
            <div class="subject-icon">⚛</div>
            <div class="subject-name">Chemistry</div>
            <div class="badge go">Explore Now</div>
        </a>

        <a class="subject-card" data-subject="math" data-soon href="#" tabindex="0">
            <div class="subject-icon">📐</div>
            <div class="subject-name">Mathematics</div>
            <div class="badge soon">Coming Soon</div>
        </a>

    </main>

</div>

<div class="soon-overlay" id="soonOverlay">
    <div class="soon-card">
        <button class="soon-close" id="soonClose" type="button" aria-label="Close">✕</button>
        <h3 id="soonTitle">Coming Soon</h3>
        <p>We're building this experience. Check back soon.</p>
    </div>
</div>

<script type="module" src="./js/explorerHome.js"></script>

</body>
</html>
