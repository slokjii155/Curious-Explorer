<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#050816">
<title>Visual Chemistry Explorer</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

:root{
    /* Solo Leveling-inspired dark purple / indigo / lavender palette,
       with cool electric blue kept strictly as a minor secondary accent */
    --accent:#9b6bff;
    --accent-2:#cbb6ff;
    --accent-deep:#3c1670;
    --accent-blue:#5b8cff;
    --accent-teal:#57e0c2;

    --font-display:'Sora', 'Segoe UI', sans-serif;
    --font-body:'Inter', 'Segoe UI', sans-serif;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    height:100dvh;
    overflow:hidden;
    overscroll-behavior:none;
}

body{
    font-family:var(--font-body);
    font-weight:400;
    letter-spacing:.1px;
    color:white;

    background:#050816;

    position:relative;

    padding:
    max(16px, env(safe-area-inset-top))
    max(16px, env(safe-area-inset-right))
    max(16px, env(safe-area-inset-bottom))
    max(16px, env(safe-area-inset-left));
}

/* ================= Background layer (movement based) ================= */

.bg-layer{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:0;

    background:
    radial-gradient(circle at 20% 15%, rgba(155,107,255,.14), transparent 55%),
    radial-gradient(circle at 85% 80%, rgba(60,22,112,.14), transparent 55%),
    #050816;

    transition: transform .25s ease-out;
    will-change: transform;
}

.bg-orb{
    position:absolute;
    border-radius:50%;
    filter:blur(4px);
    opacity:.55;
    animation: drift 10s ease-in-out infinite;
}
.bg-orb.o1{ width:14px; height:14px; top:18%; left:12%; background:var(--accent); box-shadow:0 0 20px var(--accent); animation-duration:9s; }
.bg-orb.o2{ width:9px; height:9px; top:70%; left:20%; background:var(--accent-2); box-shadow:0 0 16px var(--accent-2); animation-duration:12s; animation-delay:1s; }
.bg-orb.o3{ width:11px; height:11px; top:25%; left:82%; background:var(--accent); box-shadow:0 0 18px var(--accent); animation-duration:11s; animation-delay:2s; }
.bg-orb.o4{ width:7px; height:7px; top:78%; left:78%; background:var(--accent-2); box-shadow:0 0 14px var(--accent-2); animation-duration:8s; animation-delay:.5s; }
.bg-orb.o5{ width:6px; height:6px; top:50%; left:6%; background:var(--accent-deep); box-shadow:0 0 12px var(--accent); animation-duration:13s; }
.bg-orb.o6{ width:8px; height:8px; top:8%; left:55%; background:var(--accent-2); box-shadow:0 0 14px var(--accent-2); animation-duration:10s; animation-delay:1.5s; }

@keyframes drift{
    0%,100%{ transform:translateY(0) translateX(0); }
    50%{ transform:translateY(-26px) translateX(10px); }
}

/* ================= Overall layout ================= */

.home-layout{
    position:relative;
    z-index:2;

    width:100%;
    height:100%;

    display:flex;
    align-items:center;
    justify-content:center;
    gap:26px;

    flex-wrap:wrap;

    overflow-y:auto;
    -webkit-overflow-scrolling:touch;

    padding:8px 0;
}

.home-layout::-webkit-scrollbar{ width:0; height:0; }

/* ================= Periodic Table — centerpiece ================= */

.periodic-wrap{
    order:1;

    position:relative;

    width:min(1246px, 92vw);

    padding:26px 26px 22px;

    background:
    linear-gradient(145deg, rgba(255,255,255,.13), rgba(9,18,38,.62) 45%, rgba(5,10,24,.78));

    backdrop-filter: blur(26px) saturate(180%);
    -webkit-backdrop-filter: blur(26px) saturate(180%);

    border:1px solid rgba(155,107,255,.45);
    border-top:1px solid rgba(255,255,255,.55);
    border-radius:28px;

    box-shadow:
    0 30px 90px rgba(0,0,0,.7),
    0 0 50px rgba(155,107,255,.25),
    inset 0 1px 1px rgba(255,255,255,.35),
    inset 0 -25px 45px rgba(0,0,0,.3);

    animation: cardRise .9s cubic-bezier(.2,.8,.2,1) both;

    perspective:1200px;
}

@keyframes cardRise{
    from{ opacity:0; transform:translateY(30px) scale(.97); }
    to{ opacity:1; transform:translateY(0) scale(1); }
}

.pt-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    margin-bottom:16px;
    flex-wrap:wrap;
}

.pt-title{
    font-family:var(--font-display);
    font-size:19px;
    font-weight:800;
    letter-spacing:.3px;

    color: rgba(255,255,255,.94);

    filter: drop-shadow(0 2px 3px rgba(0,0,0,.4));
}

.pt-title small{
    display:block;
    margin-top:3px;
    font-size:11.5px;
    font-weight:500;
    letter-spacing:.3px;
    color:rgba(255,255,255,.55);
    -webkit-text-fill-color:rgba(255,255,255,.55);
    background:none;
}

.pt-toggle{
    position:relative;
    display:inline-flex;
    align-items:center;
    gap:9px;
    padding:9px 16px 9px 10px;

    font-size:12.5px;
    font-weight:700;
    letter-spacing:.3px;
    color:white;
    cursor:pointer;

    background: rgba(155,107,255,.10);
    border:1px solid rgba(155,107,255,.45);
    border-radius:999px;

    box-shadow: inset 0 1px 1px rgba(255,255,255,.15);

    transition: transform .2s ease, box-shadow .2s ease, background .2s ease;

    white-space:nowrap;
}

.pt-toggle:hover{
    transform:translateY(-2px);
    box-shadow: 0 8px 20px rgba(155,107,255,.25), inset 0 1px 1px rgba(255,255,255,.2);
    background: rgba(155,107,255,.16);
}

.pt-toggle:active{ transform:translateY(0); }

.pt-toggle-dot{
    width:9px;
    height:9px;
    border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #ffffff, var(--accent));
    box-shadow:0 0 8px var(--accent);
    flex:0 0 auto;
    transition: transform .3s ease;
}

.pt-toggle.is-hidden .pt-toggle-dot{
    background: radial-gradient(circle at 35% 30%, #666, #333);
    box-shadow:none;
}

/* Compact "closed" presentation — used mainly on mobile so the
   table never crowds the screen until the person actually wants it */

.periodic-wrap.pt-wrap-collapsed{
    padding:20px 20px 22px;
}

.periodic-wrap.pt-wrap-collapsed .pt-header{
    flex-direction:column;
    align-items:stretch;
    text-align:center;
    gap:14px;
    margin-bottom:0;
}

.periodic-wrap.pt-wrap-collapsed .pt-title small{
    display:none;
}

.periodic-wrap.pt-wrap-collapsed .pt-toggle{
    width:100%;
    justify-content:center;
    padding:15px 20px;

    font-size:14.5px;
    font-weight:700;
    color:#04121c;

    background: linear-gradient(145deg, var(--accent-2), var(--accent) 55%, var(--accent-deep));
    border:1px solid rgba(255,255,255,.5);

    box-shadow:
    0 14px 30px rgba(60,22,112,.4),
    0 5px 12px rgba(0,0,0,.35),
    inset 0 2px 3px rgba(255,255,255,.8),
    inset 0 -8px 14px rgba(0,60,90,.4);
}

.periodic-wrap.pt-wrap-collapsed .pt-toggle:hover{
    transform:translateY(-3px) scale(1.02);
}

.periodic-wrap.pt-wrap-collapsed .pt-toggle .pt-toggle-dot{
    background: radial-gradient(circle at 35% 30%, #ffffff, #04121c 120%);
    box-shadow:none;
}

.pt-body{
    display:grid;
    grid-template-rows:1fr;
    opacity:1;

    transition: grid-template-rows .5s cubic-bezier(.4,0,.2,1), opacity .4s ease;
}

.pt-body-inner{
    overflow:hidden;
    min-height:0;
}

.pt-body.pt-collapsed{
    grid-template-rows:0fr;
    opacity:0;
    pointer-events:none;
}

.pt-scroll{
    overflow-x:auto;
    overflow-y:hidden;
    -webkit-overflow-scrolling:touch;
    padding-bottom:8px;
}

.pt-scroll::-webkit-scrollbar{ height:6px; }
.pt-scroll::-webkit-scrollbar-thumb{ background:rgba(155,107,255,.35); border-radius:6px; }

.pt-tilt{
    transform-style:preserve-3d;
    transition: transform .12s ease-out;
    will-change:transform;
}

.periodic-table{
    display:grid;
    grid-template-columns:repeat(18, minmax(30px, 1fr));
    grid-template-rows:repeat(7, minmax(30px,1fr)) 12px repeat(2, minmax(30px,1fr));
    gap:3px;
    width:max-content;
    min-width:100%;
    margin:0 auto;

    animation: ptFadeIn .6s ease both;
}

@keyframes ptFadeIn{
    from{ opacity:0; transform:scale(.96); }
    to{ opacity:1; transform:scale(1); }
}

.pt-cell{
    position:relative;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    border-radius:7px;

    font-size:clamp(10px, 1vw, 13px);
    font-weight:700;
    letter-spacing:.2px;

    cursor:pointer;
    user-select:none;

    transform:translateZ(0);

    transition: transform .18s ease, box-shadow .18s ease, filter .18s ease, z-index 0s;

    border:1px solid rgba(255,255,255,.08);
}

.pt-cell .pt-num{
    position:absolute;
    top:2px;
    left:4px;
    font-size:7px;
    font-weight:500;
    opacity:.65;
}

.pt-cell::before{
    content:"";
    position:absolute;
    top:0; left:0; right:0;
    height:46%;
    border-radius:7px 7px 50% 50% / 7px 7px 100% 100%;
    background: linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,0));
    pointer-events:none;
}

.pt-cell:hover,
.pt-cell.pt-active{
    transform:translateY(-3px) translateZ(18px) scale(1.12);
    z-index:5;
    filter:brightness(1.3) saturate(1.15);
}

.pt-placeholder{
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:8px;
    font-weight:600;
    letter-spacing:.2px;
    color:rgba(255,255,255,.4);
    border-radius:7px;
    border:1px dashed rgba(255,255,255,.18);
    background:rgba(255,255,255,.03);
    cursor:default;
}

/* category colors */
.cat-alkali-metal{ background:rgba(255,95,109,.16); border-color:rgba(255,95,109,.45); box-shadow:0 0 10px rgba(255,95,109,.15); color:#ffb3ba; }
.cat-alkaline-earth-metal{ background:rgba(255,184,107,.16); border-color:rgba(255,184,107,.45); box-shadow:0 0 10px rgba(255,184,107,.15); color:#ffd9ad; }
.cat-transition-metal{ background:rgba(107,212,255,.16); border-color:rgba(107,212,255,.45); box-shadow:0 0 10px rgba(107,212,255,.15); color:#bdeeff; }
.cat-post-transition-metal{ background:rgba(125,255,179,.16); border-color:rgba(125,255,179,.45); box-shadow:0 0 10px rgba(125,255,179,.15); color:#c3ffdd; }
.cat-metalloid{ background:rgba(197,139,255,.16); border-color:rgba(197,139,255,.45); box-shadow:0 0 10px rgba(197,139,255,.15); color:#dfc3ff; }
.cat-nonmetal{ background:rgba(125,249,255,.16); border-color:rgba(125,249,255,.45); box-shadow:0 0 10px rgba(125,249,255,.15); color:#c9ffff; }
.cat-halogen{ background:rgba(255,230,107,.16); border-color:rgba(255,230,107,.45); box-shadow:0 0 10px rgba(255,230,107,.15); color:#fff2bd; }
.cat-noble-gas{ background:rgba(255,139,240,.16); border-color:rgba(255,139,240,.45); box-shadow:0 0 10px rgba(255,139,240,.15); color:#ffcdf7; }
.cat-lanthanide{ background:rgba(155,255,224,.16); border-color:rgba(155,255,224,.45); box-shadow:0 0 10px rgba(155,255,224,.15); color:#d4ffef; }
.cat-actinide{ background:rgba(255,155,155,.16); border-color:rgba(255,155,155,.45); box-shadow:0 0 10px rgba(255,155,155,.15); color:#ffd6d6; }
.cat-unknown{ background:rgba(154,165,184,.14); border-color:rgba(154,165,184,.4); color:#c3cad6; }

.pt-legend{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    margin-top:16px;
}

@media(max-width:768px){

    .pt-legend{
        flex-wrap:nowrap;
        overflow-x:auto;
        -webkit-overflow-scrolling:touch;
        margin-top:14px;
        padding-bottom:2px;

        -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 12px, #000 calc(100% - 12px), transparent 100%);
        mask-image: linear-gradient(90deg, transparent 0, #000 12px, #000 calc(100% - 12px), transparent 100%);
    }

    .pt-legend .chip{
        flex:0 0 auto;
        white-space:nowrap;
    }

    .pt-legend::-webkit-scrollbar{ display:none; }

}

.pt-legend .chip{
    font-size:10.5px;
    padding:5px 11px;
    border-radius:999px;
    display:inline-flex;
    align-items:center;
    gap:6px;
    color:rgba(255,255,255,.8);
    border:1px solid rgba(255,255,255,.12);
    background:rgba(255,255,255,.03);
    transition: transform .2s ease, background .2s ease;
}

.pt-legend .chip:hover,
.pt-legend .chip:focus-visible{
    transform: translateY(-1px);
    background:rgba(255,255,255,.08);
    outline:none;
}

.pt-legend .dot{
    width:8px;
    height:8px;
    border-radius:50%;
}

.pt-tooltip{
    position:fixed;
    z-index:60;
    pointer-events:none;

    min-width:170px;
    padding:12px 16px;

    background: rgba(12,18,38,.75);
    backdrop-filter: blur(16px) saturate(160%);
    -webkit-backdrop-filter: blur(16px) saturate(160%);

    border:1px solid rgba(155,107,255,.4);
    border-radius:14px;

    box-shadow: 0 15px 40px rgba(0,0,0,.5), 0 0 20px rgba(155,107,255,.25);

    font-size:12.5px;
    line-height:1.55;

    opacity:0;
    transform:translateY(8px);
    transition:opacity .15s ease, transform .15s ease;
}

.pt-tooltip.show{
    opacity:1;
    transform:translateY(0);
}

.pt-tooltip b{
    display:block;
    font-size:15px;
    margin-bottom:3px;
    color:var(--accent-2);
}

.pt-tooltip span{
    color:rgba(255,255,255,.55);
}

/* ================= Element detail panel ================= */

.pt-detail-overlay{
    position:fixed;
    inset:0;
    z-index:80;

    display:flex;
    align-items:center;
    justify-content:center;

    background:rgba(3,6,16,.55);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);

    opacity:0;
    pointer-events:none;

    transition:opacity .3s ease;

    padding:20px;
}

.pt-detail-overlay.show{
    opacity:1;
    pointer-events:auto;
}

.pt-detail-card{
    position:relative;
    width:min(380px, 100%);
    padding:34px 26px 28px;

    background:
    linear-gradient(145deg, rgba(255,255,255,.16), rgba(9,18,38,.75) 45%, rgba(5,10,24,.9));

    backdrop-filter:blur(32px) saturate(180%);
    -webkit-backdrop-filter:blur(32px) saturate(180%);

    border:1px solid rgba(155,107,255,.5);
    border-top:1px solid rgba(255,255,255,.6);
    border-radius:26px;

    box-shadow:
    0 34px 90px rgba(0,0,0,.75),
    0 0 55px rgba(155,107,255,.3),
    inset 0 1px 1px rgba(255,255,255,.4);

    max-height:86dvh;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;

    transform:translateY(24px) scale(.95);
    transition:transform .35s cubic-bezier(.2,.8,.2,1);
}

.pt-detail-card::-webkit-scrollbar{ width:0; }

.pt-detail-overlay.show .pt-detail-card{
    transform:translateY(0) scale(1);
}

.pt-detail-close{
    position:absolute;
    top:14px;
    right:14px;

    width:34px;
    height:34px;
    border-radius:50%;

    border:1px solid rgba(255,255,255,.2);
    background:rgba(255,255,255,.06);
    color:white;
    font-size:14px;
    cursor:pointer;

    display:flex;
    align-items:center;
    justify-content:center;

    transition:background .2s ease, transform .2s ease;
}

.pt-detail-close:hover{
    background:rgba(255,255,255,.16);
    transform:rotate(90deg);
}

.dt-symbol{
    width:74px;
    height:74px;
    margin:0 auto 16px;
    border-radius:22px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:30px;
    font-weight:800;

    border:1.5px solid transparent;
}

.pt-detail-body h3{
    font-family:var(--font-display);
    text-align:center;
    font-size:23px;
    font-weight:800;
    letter-spacing:.3px;
    margin-bottom:3px;

    background: linear-gradient(135deg, #ffffff 0%, var(--accent-2) 55%, var(--accent) 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}

.dt-cat{
    text-align:center;
    font-size:12px;
    color:rgba(255,255,255,.55);
    margin-bottom:22px;
    letter-spacing:.3px;
}

.dt-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:18px;
}

.dt-stat{
    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.1);
    border-radius:14px;
    padding:12px 10px;
    text-align:center;
}

.dt-val{
    font-family:var(--font-display);
    font-size:19px;
    font-weight:800;
    color:var(--accent-2);
    text-shadow:0 0 10px rgba(155,107,255,.4);
}

.dt-lbl{
    font-family:var(--font-display);
    font-size:10px;
    color:rgba(255,255,255,.5);
    letter-spacing:1px;
    text-transform:uppercase;
    margin-top:3px;
}

.dt-shells{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    justify-content:center;
}

.dt-shell{
    padding:6px 12px;
    border-radius:999px;
    font-size:11px;
    font-weight:700;
    background:rgba(155,107,255,.1);
    border:1px solid rgba(155,107,255,.35);
    color:rgba(255,255,255,.85);
}

.dt-info-text{
    font-size:13.5px;
    line-height:1.6;
    color:rgba(255,255,255,.8);
    text-align:center;
    margin-bottom:12px;
}

.dt-info-text.dt-info-use{
    color:var(--accent-2);
    font-weight:600;
    margin-bottom:0;
}

@media(max-width:520px){

    .pt-detail-overlay{
        align-items:flex-end;
        padding:0;
    }

    .pt-detail-card{
        width:100%;
        border-radius:26px 26px 0 0;
        max-height:80dvh;
        transform:translateY(100%);
        padding-bottom:max(28px, env(safe-area-inset-bottom));
    }

    .pt-detail-overlay.show .pt-detail-card{
        transform:translateY(0);
    }

}

/* ================= 3D Atom Logo (unchanged behaviour) =================
   Now used inside the Visualizer card's display case
   (.mc-visualizer .mc-stage .atom-stage--sm). */

/* Scoped to .mc-visualizer .mc-stage so this always wins over the base
   .atom-stage sizing below, regardless of stylesheet order. */
.mc-visualizer .mc-stage .atom-stage{
    width:64px;
    height:64px;
    margin:0;
}

.mc-visualizer .mc-stage .atom-core{
    width:16px;
    height:16px;
    margin:-8px 0 0 -8px;
}

.mc-visualizer .mc-stage .ring{
    width:64px;
    height:64px;
    margin:-32px 0 0 -32px;
}

.atom-stage{
    width:110px;
    height:110px;
    margin:0 auto 22px;
    perspective:700px;
    position:relative;
}

.atom-core{
    position:absolute;
    top:50%;
    left:50%;
    width:26px;
    height:26px;
    margin:-13px 0 0 -13px;
    border-radius:50%;

    background: radial-gradient(circle at 35% 30%, #ffffff, var(--accent-2) 45%, var(--accent-deep));
    box-shadow:
    0 0 24px var(--accent),
    0 0 40px rgba(155,107,255,.35),
    0 8px 18px rgba(0,0,0,.5),
    inset 0 4px 8px rgba(255,255,255,.8),
    inset 0 -8px 14px rgba(0,60,90,.6);

    animation: pulseCore 2.6s ease-in-out infinite;
    z-index:3;
}

@keyframes pulseCore{
    0%,100%{ transform:scale(1); }
    50%{ transform:scale(1.12); }
}

.ring{
    position:absolute;
    top:50%;
    left:50%;
    width:110px;
    height:110px;
    margin:-55px 0 0 -55px;
    border-radius:50%;
    border:1.5px solid rgba(155,107,255,.55);
    box-shadow:0 0 14px rgba(155,107,255,.3), inset 0 0 14px rgba(155,107,255,.12), inset 0 2px 3px rgba(255,255,255,.2);
    transform-style:preserve-3d;
}

.ring.r1{ transform:rotateX(75deg) rotateZ(0deg); animation:spin 6s linear infinite; }
.ring.r2{ transform:rotateX(75deg) rotateZ(60deg); animation:spin 8s linear infinite reverse; }
.ring.r3{ transform:rotateX(75deg) rotateZ(120deg); animation:spin 10s linear infinite; }

@keyframes spin{
    from{ transform:rotateX(75deg) rotateZ(var(--rot,0deg)) rotateY(0deg); }
    to{ transform:rotateX(75deg) rotateZ(var(--rot,0deg)) rotateY(360deg); }
}

.ring .e{
    position:absolute;
    width:8px;
    height:8px;
    border-radius:50%;
    top:50%;
    left:-4px;
    margin-top:-4px;

    background: radial-gradient(circle at 35% 30%, #ffffff, var(--accent-2));
    box-shadow:0 0 10px var(--accent), 0 0 16px var(--accent-2);
}

/* ================= 3D Models section ================= */
/* Reuses the same glass container + collapsible-header language as
   .periodic-wrap (.pt-header / .pt-toggle / .pt-body), so the section
   sits naturally in the page instead of introducing a new visual style. */

.models-wrap{
    order:3;

    position:relative;

    width:100%;
    max-width:1246px;

    padding:26px 26px 28px;

    background:
    linear-gradient(145deg, rgba(255,255,255,.13), rgba(9,18,38,.62) 45%, rgba(5,10,24,.78));

    backdrop-filter: blur(26px) saturate(180%);
    -webkit-backdrop-filter: blur(26px) saturate(180%);

    border:1px solid rgba(155,107,255,.45);
    border-top:1px solid rgba(255,255,255,.55);
    border-radius:28px;

    box-shadow:
    0 30px 90px rgba(0,0,0,.7),
    0 0 50px rgba(155,107,255,.25),
    inset 0 1px 1px rgba(255,255,255,.35),
    inset 0 -25px 45px rgba(0,0,0,.3);

    animation: cardRise .9s .15s cubic-bezier(.2,.8,.2,1) both;
}

/* ---- responsive grid: many per row on desktop, fewer on tablet,
   single column on mobile. Cards are capped at --mc-card-max so the
   grid gains columns instead of growing oversized cards on wide
   screens. ---- */
.models-grid{
    --mc-card-max: 300px;

    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(220px, var(--mc-card-max)));
    justify-content:center;
    gap:20px;
    margin-top:18px;
}

/* ================= Filter bar ================= */
/* Premium transparent glossy glass, matching the display-case
   language of the cards below. Sits top-left of the section, ahead
   of the grid, and never holds model data of its own — see the
   comment on #modelsFilterBar in the markup. */

.mc-filterbar{
    display:flex;
    align-items:flex-end;
    flex-wrap:wrap;
    gap:14px;
    margin-bottom:20px;
}

.mc-filter-field{
    position:relative;

    display:flex;
    flex-direction:column;
    gap:6px;

    min-width:168px;
}

.mc-filter-field label{
    font-family:var(--font-display);
    font-size:10px;
    font-weight:700;
    letter-spacing:.6px;
    text-transform:uppercase;
    color:rgba(255,255,255,.5);
    padding-left:2px;
}

.mc-filter-select{
    appearance:none;
    -webkit-appearance:none;

    width:100%;
    padding:10px 34px 10px 14px;
    border-radius:13px;

    font-family:var(--font-body);
    font-size:13px;
    font-weight:600;
    color:rgba(255,255,255,.92);

    background: linear-gradient(150deg, rgba(255,255,255,.12), rgba(9,18,38,.5) 55%, rgba(5,10,24,.62));
    backdrop-filter: blur(18px) saturate(170%);
    -webkit-backdrop-filter: blur(18px) saturate(170%);

    border:1px solid rgba(155,107,255,.32);
    border-top:1px solid rgba(255,255,255,.4);

    box-shadow:
    0 10px 26px rgba(0,0,0,.4),
    inset 0 1px 1px rgba(255,255,255,.2);

    transition: border-color .25s ease, box-shadow .25s ease, background .25s ease;
    cursor:pointer;
}

.mc-filter-select:hover{
    border-color:rgba(155,107,255,.55);
}

.mc-filter-select:focus-visible{
    outline:none;
    border-color:rgba(155,107,255,.75);
    box-shadow:
    0 10px 26px rgba(0,0,0,.4),
    0 0 0 3px rgba(155,107,255,.28),
    inset 0 1px 1px rgba(255,255,255,.25);
}

.mc-filter-select:disabled{
    cursor:not-allowed;
    color:rgba(255,255,255,.35);
    background: linear-gradient(150deg, rgba(255,255,255,.05), rgba(9,18,38,.4) 55%, rgba(5,10,24,.5));
}

.mc-filter-select option{
    background:#0b1224;
    color:#fff;
}

.mc-filter-arrow{
    position:absolute;
    right:13px;
    bottom:11px;
    font-size:10px;
    color:rgba(255,255,255,.45);
    pointer-events:none;
}

.mc-filter-clear{
    padding:10px 16px;
    border-radius:13px;

    font-family:var(--font-display);
    font-size:11.5px;
    font-weight:700;
    letter-spacing:.3px;
    color:rgba(255,255,255,.75);

    background: rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.16);

    cursor:pointer;
    transition: border-color .25s ease, color .25s ease, background .25s ease;
}

.mc-filter-clear:hover,
.mc-filter-clear:focus-visible{
    color:#fff;
    border-color:rgba(255,255,255,.35);
    background: rgba(255,255,255,.08);
    outline:none;
}

.mc-filter-empty{
    padding:26px 18px;
    margin-bottom:6px;
    border-radius:16px;
    text-align:center;

    font-size:13px;
    color:rgba(255,255,255,.55);

    background: rgba(255,255,255,.03);
    border:1px dashed rgba(255,255,255,.14);
}

.mc-filter-empty-clear{
    color: var(--accent-2);
    font-weight:700;
    text-decoration:underline;
    text-underline-offset:2px;
    cursor:pointer;
}

@media(max-width:520px){
    .mc-filterbar{ gap:10px; }
    .mc-filter-field{ min-width:0; flex:1 1 120px; }
    .mc-filter-clear{ flex:1 0 100%; text-align:center; }
}

/* ================= Premium model cards =================
   Each card is a "glass display case" for exactly one model:
   a lit glass box on top (.mc-preview, holding a small rotating
   crystal that stands in for the model's 3D subject) sitting over
   a plinth of card details. Subject sets the case's accent color
   via the --card-accent custom property, written inline per card
   by renderModelCards() below — nothing here is hard-coded to a
   specific subject or model. */

.model-card{
    --card-accent: var(--accent);
    --tiltX: 0deg;
    --tiltY: 0deg;

    position:relative;

    width:100%;
    max-width:var(--mc-card-max);
    margin:0 auto;

    border-radius:22px;

    display:flex;
    flex-direction:column;
    text-align:left;
    text-decoration:none;
    color:inherit;

    background: linear-gradient(145deg, rgba(255,255,255,.10), rgba(9,18,38,.58) 45%, rgba(5,10,24,.74));

    backdrop-filter: blur(20px) saturate(170%);
    -webkit-backdrop-filter: blur(20px) saturate(170%);

    border:1px solid rgba(155,107,255,.32);
    border-top:1px solid rgba(255,255,255,.42);

    box-shadow:
    0 18px 44px rgba(0,0,0,.55),
    0 0 26px rgba(155,107,255,.12),
    inset 0 1px 1px rgba(255,255,255,.2);

    transform: perspective(900px) rotateX(var(--tiltX)) rotateY(var(--tiltY)) translateY(0) scale(1);
    transition: transform .45s cubic-bezier(.2,.8,.2,1), box-shadow .4s ease, border-color .4s ease;
    will-change: transform;
}

/* .model-card sets display:flex above, which otherwise beats the
   browser's low-specificity default [hidden]{display:none} rule by
   source order — this makes the "hidden" attribute (used to hide the
   Visualizer card when it's filtered out) actually take effect. */
.model-card[hidden]{
    display:none;
}

/* -------- preview: the glass "display case" -------- */

.mc-preview{
    position:relative;
    height:128px;
    margin:14px 14px 0;
    border-radius:16px;
    overflow:hidden;

    background:
    radial-gradient(120% 140% at 26% 18%, color-mix(in srgb, var(--card-accent) 30%, transparent), transparent 62%),
    linear-gradient(165deg, rgba(255,255,255,.10), rgba(5,10,24,.55));

    border:1px solid rgba(255,255,255,.14);
    box-shadow:
    inset 0 1px 1px rgba(255,255,255,.28),
    inset 0 -22px 30px rgba(0,0,0,.4);
}

/* ambient glow seated behind the crystal, like a lit case floor */
.mc-preview::before{
    content:"";
    position:absolute;
    left:50%;
    bottom:-10px;
    width:74%;
    height:36px;
    transform:translateX(-50%);
    border-radius:50%;
    background: radial-gradient(closest-side, color-mix(in srgb, var(--card-accent) 65%, transparent), transparent 75%);
    filter: blur(2px);
    opacity:.55;
}

/* glass sheen sweep — sits still by default, glides across on hover
   for available cards (tracked to the pointer via --mx) */
.mc-preview::after{
    content:"";
    position:absolute;
    inset:0;
    background: linear-gradient(115deg, transparent 34%, rgba(255,255,255,.30) 49%, transparent 64%);
    transform: translateX(calc(var(--mx, 50%) - 50%));
    opacity:.18;
    transition: opacity .4s ease;
    pointer-events:none;
}

.mc-stage{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    perspective:340px;
}

/* the "3D scientific object" — an abstract faceted crystal built
   from stacked, rotated panes so it reads as a solid object without
   needing a per-model 3D asset yet. Spins slowly at rest. */
.mc-crystal{
    position:relative;
    width:52px;
    height:52px;
    transform-style:preserve-3d;
    animation: crystalSpin 10s linear infinite;
}

.mc-crystal .facet{
    position:absolute;
    inset:0;
    border-radius:10px;
    background: linear-gradient(160deg, color-mix(in srgb, var(--card-accent) 85%, white 15%), color-mix(in srgb, var(--card-accent) 55%, #050816 45%));
    border:1px solid rgba(255,255,255,.5);
    box-shadow: inset 0 2px 4px rgba(255,255,255,.5), inset 0 -8px 12px rgba(0,0,0,.35);
    opacity:.88;
}

.mc-crystal .facet.f1{ transform:rotateY(0deg) translateZ(20px); }
.mc-crystal .facet.f2{ transform:rotateY(90deg) translateZ(20px); }
.mc-crystal .facet.f3{ transform:rotateY(180deg) translateZ(20px); }
.mc-crystal .facet.f4{ transform:rotateY(270deg) translateZ(20px); }
.mc-crystal .facet.f5{ transform:rotateX(90deg) translateZ(20px); opacity:.6; }

@keyframes crystalSpin{
    from{ transform:rotateY(0deg) rotateX(8deg); }
    to{ transform:rotateY(360deg) rotateX(8deg); }
}

/* subject glyph rides in front, tagged to the case like a specimen
   label rather than centered over the crystal */
.mc-tag{
    position:absolute;
    top:10px;
    left:10px;
    width:26px;
    height:26px;
    border-radius:9px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:13px;

    background: rgba(5,10,24,.55);
    border:1px solid rgba(255,255,255,.22);
    backdrop-filter: blur(6px);
    box-shadow: inset 0 1px 1px rgba(255,255,255,.25);
}

/* -------- body: name / meta / description -------- */

.mc-body{
    padding:14px 18px 4px;
    display:flex;
    flex-direction:column;
    gap:7px;
}

.mc-name{
    font-family:var(--font-display);
    font-size:16px;
    font-weight:800;
    letter-spacing:.2px;
    line-height:1.25;

    color: rgba(255,255,255,.95);
    filter: drop-shadow(0 2px 3px rgba(0,0,0,.4));
}

.mc-meta{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:6px 8px;
    font-size:11px;
}

.mc-meta-subject{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-weight:700;
    letter-spacing:.3px;
    color: color-mix(in srgb, var(--card-accent) 78%, white 22%);
}

.mc-meta-subject::before{
    content:"";
    width:6px;
    height:6px;
    border-radius:50%;
    background: var(--card-accent);
    box-shadow: 0 0 8px var(--card-accent);
}

.mc-meta-topic{
    color:rgba(255,255,255,.5);
}

.mc-meta-class{
    margin-left:auto;
    flex:0 0 auto;

    font-family:var(--font-display);
    font-weight:700;
    letter-spacing:.3px;
    font-size:10px;
    text-transform:uppercase;
    white-space:nowrap;

    padding:3px 8px;
    border-radius:999px;

    color:rgba(255,255,255,.6);
    background: rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.14);
}

.mc-desc{
    font-size:12.5px;
    line-height:1.5;
    color:rgba(255,255,255,.62);
}

/* -------- action -------- */

.mc-footer{
    margin-top:auto;
    padding:14px 18px 18px;
}

.mc-action{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;

    padding:10px 14px;
    border-radius:12px;

    font-family:var(--font-display);
    font-weight:700;
    font-size:12px;
    letter-spacing:.4px;
}

.mc-action.is-available{
    color:#04121c;
    background: linear-gradient(145deg, var(--accent-2), var(--accent) 70%);
    border:1px solid rgba(255,255,255,.5);
    box-shadow: inset 0 1px 1px rgba(255,255,255,.6), 0 8px 20px rgba(155,107,255,.28);
    transition: box-shadow .3s ease, transform .3s ease;
}

.mc-action.is-soon{
    color:rgba(255,255,255,.42);
    text-transform:uppercase;
    background: rgba(255,255,255,.03);
    border:1px dashed rgba(255,255,255,.18);
    letter-spacing:.7px;
    font-size:10.5px;
}

/* -------- available card: lift, tilt, and glow follow the cursor -------- */

.model-card.mc-active{
    cursor:pointer;
}

.model-card.mc-active:hover,
.model-card.mc-active:focus-visible{
    transform: perspective(900px) rotateX(var(--tiltX)) rotateY(var(--tiltY)) translateY(-7px) scale(1.015);
    border-color: color-mix(in srgb, var(--card-accent) 60%, rgba(255,255,255,.55));
    box-shadow:
    0 30px 62px rgba(0,0,0,.6),
    0 0 40px color-mix(in srgb, var(--card-accent) 40%, transparent),
    inset 0 1px 1px rgba(255,255,255,.3);
}

.model-card.mc-active:hover .mc-preview::after{
    opacity:.5;
}

.model-card.mc-active:hover .mc-crystal{
    animation-duration:3s;
}

.model-card.mc-active:hover .mc-preview::before{
    opacity:.8;
}

/* -------- coming-soon card: same case, deliberately quieter -------- */

.model-card.mc-soon{
    cursor:default;
}

.model-card.mc-soon .mc-preview{
    filter:grayscale(.55) brightness(.8);
}

.model-card.mc-soon .mc-crystal{
    animation-duration:22s;
    opacity:.7;
}

.model-card.mc-soon .mc-name{
    color:rgba(255,255,255,.78);
}

.model-card.mc-soon:hover{
    border-color:rgba(255,255,255,.22);
    box-shadow:
    0 20px 46px rgba(0,0,0,.55),
    0 0 22px rgba(255,255,255,.06),
    inset 0 1px 1px rgba(255,255,255,.2);
}

@media (prefers-reduced-motion: reduce){
    .mc-crystal{ animation:none; }
    .model-card{ transition:box-shadow .3s ease, border-color .3s ease; }
}

@media(max-width:1024px){
    .models-grid{ --mc-card-max: 280px; grid-template-columns:repeat(auto-fill, minmax(200px, var(--mc-card-max))); gap:16px; }
}

@media(max-width:768px){
    .models-wrap{ order:3; width:100%; padding:20px 16px 18px; }
    .models-grid{ grid-template-columns:repeat(2, minmax(0, var(--mc-card-max))); gap:14px; }
    .mc-preview{ height:108px; }
}

@media(max-width:520px){
    .models-grid{ grid-template-columns:minmax(0, 1fr); }
    .model-card{ max-width:340px; }
}

/* ================= Responsive ================= */

@media(max-width:980px){

    .periodic-wrap{ width:min(920px, 92vw); }

}

@media(max-width:768px){

    .home-layout{
        flex-direction:column;
        align-items:stretch;
        justify-content:flex-start;
        gap:16px;
        padding:4px 2px 20px;
    }

    /* On phones the periodic table still leads the page; the 3D
       Models section (with the Visualizer card) follows underneath. */

    .periodic-wrap{
        order:1;
        width:100%;
        padding:20px 16px 16px;
    }

    .pt-title{ font-size:16px; }

    .periodic-table{
        grid-template-columns:repeat(18, minmax(26px, 1fr));
        grid-template-rows:repeat(7, minmax(26px,1fr)) 10px repeat(2, minmax(26px,1fr));
    }
}

@media(max-width:420px){

    .pt-header{ align-items:flex-start; }

    .periodic-table{
        grid-template-columns:repeat(18, minmax(24px, 1fr));
        grid-template-rows:repeat(7, minmax(24px,1fr)) 9px repeat(2, minmax(24px,1fr));
    }

    .pt-cell .pt-num{ display:none; }
}

/* short / landscape phones */
@media(max-height:480px) and (orientation:landscape){
    .home-layout{ flex-direction:row; flex-wrap:wrap; align-items:stretch; }
    .periodic-wrap{ width:100%; padding:14px; }
}

</style>

<body>

         PERIODIC TABLE — CENTERPIECE
    ===================== -->

    <section class="periodic-wrap" id="periodicWrap">

<script type="module">

import { ELEMENTS } from "./js/elements.js";
import { getModelById, filterModels, sortModels } from "./js/data/models3d.js";
import { SUBJECTS, CLASS_OPTIONS, getTopicOptions } from "./js/data/filterTaxonomy.js";

//====================================================
// Build the periodic table grid from the SAME element
// data used by the 3D explorer (js/elements.js) —
// no duplicate data, no new data files.
//====================================================

const CATEGORY_CLASS = {
    "Alkali Metal":"cat-alkali-metal",
    "Alkaline Earth Metal":"cat-alkaline-earth-metal",
    "Transition Metal":"cat-transition-metal",
    "Post Transition Metal":"cat-post-transition-metal",
    "Metalloid":"cat-metalloid",
    "Nonmetal":"cat-nonmetal",
    "Halogen":"cat-halogen",

function getPosition(z){

    if(z === 1) return { row:1, col:1 };
    if(z === 2) return { row:1, col:18 };

    if(z >= 3 && z <= 10){
        const map = [1,2,13,14,15,16,17,18];
        return { row:2, col:map[z-3] };
    }

    if(z >= 11 && z <= 18){
        const map = [1,2,13,14,15,16,17,18];
        return { row:3, col:map[z-11] };
    }

    if(z >= 19 && z <= 36) return { row:4, col:z-18 };
    if(z >= 37 && z <= 54) return { row:5, col:z-36 };

    if(z === 55) return { row:6, col:1 };
    if(z === 56) return { row:6, col:2 };

    if(z >= 57 && z <= 71) return { row:9, col:3+(z-57) };

    if(z >= 72 && z <= 86) return { row:6, col:(z-72)+4 };

    if(z === 87) return { row:7, col:1 };
    if(z === 88) return { row:7, col:2 };

    if(z >= 89 && z <= 103) return { row:10, col:3+(z-89) };

    if(z >= 104 && z <= 118) return { row:7, col:(z-104)+4 };

    return null;
}

function showTooltip(el, x, y){

    tooltipEl.innerHTML =
        "<b>" + el.name + " (" + el.symbol + ")</b>" +
        "Atomic Number: " + el.atomicNumber + "<br>" +
        "<span>" + el.category + " · " + el.electrons + " electrons</span>";

    positionTooltip(x, y);

    tooltipEl.classList.add("show");
}

function positionTooltip(x, y){

    const tw = tooltipEl.offsetWidth || 180;
    const th = tooltipEl.offsetHeight || 70;

    let left = x + 16;
    let top = y + 16;

    if(left + tw > window.innerWidth - 10) left = x - tw - 16;
    if(top + th > window.innerHeight - 10) top = y - th - 16;
    if(left < 10) left = 10;
    if(top < 10) top = 10;

    tooltipEl.style.left = left + "px";
    tooltipEl.style.top = top + "px";
}

function hideTooltip(){
    tooltipEl.classList.remove("show");
}

// Render 3D Models grid from the centralized model data
// (./js/data/models3d.js). One card per MODEL, never per
// subject — see the "core rule" comment at the top of that
// file. Adding a new model to the library is done there, by
// adding data; nothing here needs to change.
//====================================================

const SUBJECT_ICON = {
    "Chemistry": "⚛",
    "Physics": "🪐",
    "Biology": "🧬"
};

// CSS custom-property name per subject — drives the display case's
// glow, sheen tint and specimen-tag color. New subjects fall back to
// the default violet accent rather than needing a code change here.
const SUBJECT_ACCENT_VAR = {
    "Chemistry": "var(--accent)",
    "Physics": "var(--accent-blue)",
    "Biology": "var(--accent-teal)"
};

function iconForModel(model){
    return SUBJECT_ICON[model.subject] || "🧭";
}

function accentForModel(model){
    return SUBJECT_ACCENT_VAR[model.subject] || "var(--accent)";
}

// "[9,10,11,12]" -> "Class 9–12"; "[11,12]" -> "Class 11–12";
// a single-class list collapses to "Class 11".
function classLabel(classes){
    if (!Array.isArray(classes) || classes.length === 0) return "";
    const min = Math.min(...classes);
    const max = Math.max(...classes);
    return "Class " + (min === max ? String(min) : min + "–" + max);
}

const prefersReducedMotion = window.matchMedia &&
    window.matchMedia("(prefers-reduced-motion: reduce)").matches;

// Pointer-tracked lift/tilt/sheen for available cards only — the
// number of "available" models stays small relative to the whole
// library even as it grows into the hundreds, so a listener per
// active card is cheap; coming-soon cards get a plain CSS hover
// instead and never carry this cost.
function attachModelCardTilt(card){
    if (prefersReducedMotion) return;

    const maxTilt = 7;

    function handleMove(e){
        const rect = card.getBoundingClientRect();
        const px = (e.clientX - rect.left) / rect.width;
        const py = (e.clientY - rect.top) / rect.height;

        card.style.setProperty("--tiltX", ((0.5 - py) * maxTilt * 2).toFixed(2) + "deg");
        card.style.setProperty("--tiltY", ((px - 0.5) * maxTilt * 2).toFixed(2) + "deg");
        card.style.setProperty("--mx", (px * 100).toFixed(1) + "%");
    }

    function reset(){
        card.style.setProperty("--tiltX", "0deg");
        card.style.setProperty("--tiltY", "0deg");
    }

    card.addEventListener("pointermove", handleMove);
    card.addEventListener("pointerleave", reset);
    card.addEventListener("blur", reset);
}

// Builds the glass display-case preview shared by every generated
// card: a lit case, a slowly-spinning faceted "crystal" standing in
// for the model's 3D subject, and a specimen tag carrying the
// subject icon. Coming-soon cases render the same markup — they're
// simply dimmed and slowed by the .mc-soon CSS rules, never hidden
// or swapped for something that implies functionality.
function buildPreview(model){
    const preview = document.createElement("div");
    preview.className = "mc-preview";

    const stage = document.createElement("div");
    stage.className = "mc-stage";

    const crystal = document.createElement("div");
    crystal.className = "mc-crystal";
    ["f1", "f2", "f3", "f4", "f5"].forEach((f) => {
        const facet = document.createElement("div");
        facet.className = "facet " + f;
        crystal.appendChild(facet);
    });

    stage.appendChild(crystal);
    preview.appendChild(stage);

    const tag = document.createElement("div");
    tag.className = "mc-tag";
    tag.textContent = iconForModel(model);
    preview.appendChild(tag);

    return preview;
}

function buildModelCard(model){

    const available = model.status === "available";

    const el = document.createElement(available ? "a" : "div");
    el.className = "model-card " + (available ? "mc-active" : "mc-soon");
    el.setAttribute("data-model-id", model.id);
    el.setAttribute("data-subject", model.subject);
    el.style.setProperty("--card-accent", accentForModel(model));

    if (available) {
        el.href = model.route;
        el.setAttribute("tabindex", "0");
    } else {
        // Never a live link and never styled as one — no href, no
        // click target, so there is no broken route to follow.
        el.setAttribute("aria-disabled", "true");
    }

    el.appendChild(buildPreview(model));

    const body = document.createElement("div");
    body.className = "mc-body";

    const name = document.createElement("div");
    name.className = "mc-name";
    name.textContent = model.name;
    body.appendChild(name);

    const meta = document.createElement("div");
    meta.className = "mc-meta";

    const subjectEl = document.createElement("span");
    subjectEl.className = "mc-meta-subject";
    subjectEl.textContent = model.subject;
    meta.appendChild(subjectEl);

    if (model.topic) {
        const topicEl = document.createElement("span");
        topicEl.className = "mc-meta-topic";
        topicEl.textContent = "• " + model.topic;
        meta.appendChild(topicEl);
    }

    const classEl = document.createElement("span");
    classEl.className = "mc-meta-class";
    classEl.textContent = classLabel(model.classes);
    meta.appendChild(classEl);

    body.appendChild(meta);

    const desc = document.createElement("div");
    desc.className = "mc-desc";
    desc.textContent = model.description || "";
    body.appendChild(desc);

    el.appendChild(body);

    const footer = document.createElement("div");
    footer.className = "mc-footer";

    const action = document.createElement("span");
    action.className = "mc-action " + (available ? "is-available" : "is-soon");
    action.textContent = available ? "Explore →" : "◇ Coming Soon";
    footer.appendChild(action);

    el.appendChild(footer);

    if (available) {
        attachModelCardTilt(el);
    }

    return el;
}

//====================================================
// Filter bar — Subject / Class / Topic
//
// Filters never hold their own copy of model data. Every render
// pass calls filterModels() from ./js/data/models3d.js against the
// one centralized dataset; this section only tracks which options
// are selected and rebuilds the grid from whatever that call
// returns.
//====================================================

const filterSubjectEl = document.getElementById("filterSubject");
const filterClassEl = document.getElementById("filterClass");
const filterTopicEl = document.getElementById("filterTopic");
const filterClearBtn = document.getElementById("modelsClearFiltersBtn");
const filterEmptyEl = document.getElementById("modelsFilterEmpty");
const filterEmptyClearBtn = document.getElementById("modelsFilterEmptyClear");

function populateFilterOptions(){

    if (!filterSubjectEl || !filterClassEl || !filterTopicEl) return;

    const subjectAll = document.createElement("option");
    subjectAll.value = "all";
    subjectAll.textContent = "All Subjects";
    filterSubjectEl.appendChild(subjectAll);

    SUBJECTS.forEach((subject) => {
        const opt = document.createElement("option");
        opt.value = subject;
        opt.textContent = subject;
        filterSubjectEl.appendChild(opt);
    });

    // Chemistry keeps its full Chemistry page (including the Periodic Table),
    // while the 3D Models subsection itself is scoped to Chemistry models only.
    filterSubjectEl.value = "Chemistry";
    filterSubjectEl.disabled = true;

    CLASS_OPTIONS.forEach((entry) => {
        const opt = document.createElement("option");
        opt.value = String(entry.value);
        opt.textContent = entry.label;
        filterClassEl.appendChild(opt);
    });

    refreshTopicOptions();
}

// A class <select> only ever carries strings, so numeric class
// values ("11") are parsed back to numbers here — everything else
// (subject names, "dropper"/"competitive"/"ug" tokens) passes
// through as-is.
function parseClassValue(raw){
    if (raw === "all" || raw === "") return "all";
    return /^\d+$/.test(raw) ? Number(raw) : raw;
}

// Rebuilds the Topic <select> to match the current Subject + Class
// selection. Per the filter spec: don't show every topic when a
// subject-specific list is available, and don't show any curated
// list at all until a subject is chosen.
function refreshTopicOptions(){
    if (!filterTopicEl || !filterSubjectEl || !filterClassEl) return;

    const subject = filterSubjectEl.value;
    const classValue = parseClassValue(filterClassEl.value);
    const topics = getTopicOptions(subject, classValue);
    const previousValue = filterTopicEl.value;

    filterTopicEl.innerHTML = "";

    const allOpt = document.createElement("option");
    allOpt.value = "all";
    allOpt.textContent = "All Topics";
    filterTopicEl.appendChild(allOpt);

    topics.forEach((topic) => {
        const opt = document.createElement("option");
        opt.value = topic;
        opt.textContent = topic;
        filterTopicEl.appendChild(opt);
    });

    // Keep the previous topic selected if it's still offered under the
    // new subject/class (e.g. switching Class 11 -> 12 within
    // Chemistry keeps "Atomic Structure" selected); otherwise reset.
    filterTopicEl.value = topics.indexOf(previousValue) !== -1 ? previousValue : "all";
    filterTopicEl.disabled = topics.length === 0;
}

function getSelectedCriteria(){
    const criteria = {};

    if (filterSubjectEl && filterSubjectEl.value !== "all") {
        criteria.subject = filterSubjectEl.value;
    }

    if (filterClassEl && filterClassEl.value !== "all") {
        criteria.classLevel = parseClassValue(filterClassEl.value);
    }

    if (filterTopicEl && !filterTopicEl.disabled && filterTopicEl.value !== "all") {
        criteria.topic = filterTopicEl.value;
    }

    return criteria;
}

function renderModelCards(){

    // The Visualizer card is hand-authored above (it hosts the unique
    // orbiting-electron preview instead of the generic crystal) but
    // its copy is still sourced from the "atomic-structure" record,
    // so there's still only one place that text lives.
    const visualizerModel = getModelById("atomic-structure");
    if (visualizerModel) {
        const nameEl = document.getElementById("visualizerCardName");
        const descEl = document.getElementById("visualizerCardDesc");
        if (nameEl) nameEl.textContent = visualizerModel.name;
        if (descEl) descEl.textContent = visualizerModel.description;
    }

    const grid = document.getElementById("modelsGrid");
    if (!grid) return;

    const criteria = getSelectedCriteria();
    const matches = filterModels(criteria);
    const matchIds = new Set(matches.map((m) => m.id));

    // The Visualizer card represents the "atomic-structure" model —
    // it respects the same filters as every generated card instead
    // of always staying visible.
    const visualizerCard = document.getElementById("visualizerCard");
    if (visualizerCard) {
        const visible = matchIds.has("atomic-structure");
        visualizerCard.hidden = !visible;
        if (visible) attachModelCardTilt(visualizerCard);
    }

    // Clear only previously generated cards — the hand-authored
    // Visualizer card stays in place and is just shown/hidden above.
    grid.querySelectorAll(".model-card:not(#visualizerCard)").forEach((el) => el.remove());

    const rest = sortModels(
        matches.filter((m) => m.id !== "atomic-structure"),
        "priority",
        "desc"
    );

    rest.forEach((model) => {
        grid.appendChild(buildModelCard(model));
    });

    if (filterEmptyEl) filterEmptyEl.hidden = matches.length !== 0;
}

function clearModelFilters(){
    // The Chemistry page always keeps the 3D Models subsection scoped to
    // Chemistry; clearing filters only resets class/topic within Chemistry.
    if (filterSubjectEl) filterSubjectEl.value = "Chemistry";
    if (filterClassEl) filterClassEl.value = "all";
    refreshTopicOptions();
    renderModelCards();
}

if (filterSubjectEl) {
    filterSubjectEl.addEventListener("change", () => {
        refreshTopicOptions();
        renderModelCards();
    });
}

if (filterClassEl) {
    filterClassEl.addEventListener("change", () => {
        refreshTopicOptions();
        renderModelCards();
    });
}

if (filterTopicEl) {
    filterTopicEl.addEventListener("change", renderModelCards);
}

if (filterClearBtn) {
    filterClearBtn.addEventListener("click", clearModelFilters);
}

if (filterEmptyClearBtn) {
    filterEmptyClearBtn.addEventListener("click", clearModelFilters);
}

populateFilterOptions();
renderModelCards();

//====================================================
// Subtle 3D parallax — desktop cursor + mobile touch
// (lightweight, no extra libraries)
//====================================================

function attachTilt(zoneEl, tiltEl, maxDeg){

    let raf = null;
    let targetX = 0, targetY = 0, curX = 0, curY = 0;

    function apply(){

        curX += (targetX - curX) * 0.12;
        curY += (targetY - curY) * 0.12;

        tiltEl.style.transform =
            "rotateX(" + curY + "deg) rotateY(" + curX + "deg)";

        if(Math.abs(targetX-curX) > 0.05 || Math.abs(targetY-curY) > 0.05){
            raf = requestAnimationFrame(apply);
        } else {
            raf = null;
        }
    }

    function setFromPoint(clientX, clientY){

        const rect = zoneEl.getBoundingClientRect();

        const relX = (clientX - rect.left) / rect.width;
        const relY = (clientY - rect.top) / rect.height;

        targetX = (relX - 0.5) * (maxDeg * 2);
        targetY = -(relY - 0.5) * (maxDeg * 2);

        if(!raf) raf = requestAnimationFrame(apply);
    }

    function reset(){
        targetX = 0;
        targetY = 0;
        if(!raf) raf = requestAnimationFrame(apply);
    }

    zoneEl.addEventListener("mousemove", (e)=> setFromPoint(e.clientX, e.clientY));
    zoneEl.addEventListener("mouseleave", reset);

    zoneEl.addEventListener("touchmove", (e)=>{
        if(!e.touches || !e.touches.length) return;
        setFromPoint(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive:true });

    zoneEl.addEventListener("touchend", reset, { passive:true });
    zoneEl.addEventListener("touchcancel", reset, { passive:true });
}

attachTilt(document.getElementById("periodicWrap"), document.getElementById("ptTilt"), 5);

//====================================================
// Background parallax — the whole ambient glow layer
// drifts subtly with cursor position for a sense of depth
//====================================================

const bgLayer = document.getElementById("bgLayer");
let bgRaf = null;
let bgTargetX = 0, bgTargetY = 0, bgCurX = 0, bgCurY = 0;

function applyBg(){

    bgCurX += (bgTargetX - bgCurX) * 0.06;
    bgCurY += (bgTargetY - bgCurY) * 0.06;

    bgLayer.style.transform =
        "translate3d(" + bgCurX + "px," + bgCurY + "px,0)";

    if(Math.abs(bgTargetX-bgCurX) > 0.1 || Math.abs(bgTargetY-bgCurY) > 0.1){
        bgRaf = requestAnimationFrame(applyBg);
    } else {
        bgRaf = null;
    }
}

window.addEventListener("mousemove", (e)=>{

    const relX = e.clientX / window.innerWidth - 0.5;
    const relY = e.clientY / window.innerHeight - 0.5;

    bgTargetX = relX * 26;
    bgTargetY = relY * 26;

    if(!bgRaf) bgRaf = requestAnimationFrame(applyBg);
});

// gentle device-tilt based background drift on mobile
window.addEventListener("deviceorientation", (e)=>{

    if(e.gamma === null || e.beta === null) return;

    bgTargetX = Math.max(-18, Math.min(18, e.gamma * 0.6));
    bgTargetY = Math.max(-18, Math.min(18, (e.beta - 45) * 0.25));

    if(!bgRaf) bgRaf = requestAnimationFrame(applyBg);

}, true);

</script>
