<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#020203">

<title>Explorer</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

:root{
    --royal-black:#010102;
    --glass:rgba(255,255,255,.05);
    --glass-strong:rgba(255,255,255,.09);
    --glass-border:rgba(255,255,255,.14);
    --lavender:#b9a6ff;
    --lavender-soft:#d9cfff;
    --lavender-glow:rgba(185,166,255,.35);
    --lavender-tint:rgba(150,128,255,.10);

    --font-display:'Sora', 'Segoe UI', sans-serif;
    --font-body:'Inter', 'Segoe UI', sans-serif;

    --px:0px;
    --py:0px;
    --tiltX:0deg;
    --tiltY:0deg;
    --shine:30px;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    min-height:100%;
    min-height:100dvh;
    /* Natural page scroll: the hero still fills the first screen
       (see .page's min-height:100vh below), but the page itself can
       grow — so Show More / additional homepage content is always
       reachable by normal scrolling instead of being clipped. */
    overflow-x:hidden;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior-x:none;
    background:var(--royal-black);
    touch-action:pan-y;
}

body{
    font-family:var(--font-body);
    font-weight:400;
    letter-spacing:.1px;
    color:#fff;
    position:relative;

    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;

    padding:
    max(20px, env(safe-area-inset-top))
    max(20px, env(safe-area-inset-right))
    max(20px, env(safe-area-inset-bottom))
    max(20px, env(safe-area-inset-left));
}

#bgCanvas{
    position:fixed;
    inset:0;
    z-index:0;
    display:block;
}

/* soft dark vignette so text stays readable over the 3D scene — a faint
   purple undertone instead of flat black, for a more premium, less
   "empty" dark feel */
.vignette{
    position:fixed;
    inset:0;
    z-index:1;
    pointer-events:none;
    background:
    radial-gradient(circle at 50% 38%, transparent 0%, rgba(9,5,18,.46) 60%, rgba(4,2,9,.93) 100%);
}

/* directional light tint — soft royal white/lavender wash across the glass,
   plus a gentle overall lavender tint across the whole scene */
.light-tint{
    position:fixed;
    inset:0;
    z-index:1;
    pointer-events:none;
    background:
    radial-gradient(ellipse 950px 660px at 78% -6%, rgba(255,255,255,.13), transparent 62%),
    radial-gradient(ellipse 750px 560px at 6% 6%, rgba(185,166,255,.18), transparent 60%),
    radial-gradient(ellipse 1200px 900px at 50% 60%, var(--lavender-tint), transparent 72%);
    mix-blend-mode:screen;
}

/* glossy glass reflection sweep — echoes light catching a curved glass surface */
.glass-sweep{
    position:fixed;
    inset:0;
    z-index:1;
    pointer-events:none;
    overflow:hidden;
    opacity:.55;
}

.glass-sweep svg{
    position:absolute;
    top:-8%;
    right:-14%;
    width:min(1100px, 130vw);
    height:auto;
    filter:blur(.3px);
    animation:sweepDrift 14s ease-in-out infinite;
}

@keyframes sweepDrift{
    0%,100%{ transform:translate(0,0) rotate(0deg); }
    50%{ transform:translate(-14px, 10px) rotate(.6deg); }
}

/* ===================== SUNLIGHT FROM ABOVE ===================== */
/* a soft column of light falling from the top of the frame, like a single
   shaft of sunlight in a dark room — shifts gently with the cursor */

.sun-rays{
    position:fixed;
    inset:0;
    z-index:1;
    pointer-events:none;
    mix-blend-mode:screen;
    opacity:.85;
    transform:translateX(var(--px));
    transition:transform .4s ease-out;
}

.sun-rays::before{
    content:"";
    position:absolute;
    left:50%;
    top:-38%;
    width:min(1400px, 130vw);
    height:1100px;
    transform:translateX(-50%);
    background:conic-gradient(from 200deg at 50% 0%,
        transparent 0deg,
        rgba(255,255,255,.10) 8deg,
        transparent 16deg,
        transparent 24deg,
        rgba(217,207,255,.08) 33deg,
        transparent 42deg,
        transparent 150deg,
        rgba(255,255,255,.07) 158deg,
        transparent 166deg,
        transparent 360deg);
    filter:blur(2px);
}

.sun-rays::after{
    content:"";
    position:absolute;
    left:50%;
    top:-20%;
    width:640px;
    height:640px;
    transform:translateX(-50%);
    background:radial-gradient(circle, rgba(255,255,255,.20) 0%, rgba(217,207,255,.10) 34%, transparent 68%);
    filter:blur(6px);
}

/* ===================== LIQUID AURORA GLOW ===================== */
/* slow-drifting soft colour wash behind everything — the "liquid glass" wisps
   seen in the reference art, kept subtle and out of the way of the text */

.aurora-glow{
    position:fixed;
    inset:0;
    z-index:1;
    pointer-events:none;
    opacity:.6;
    mix-blend-mode:screen;
    filter:blur(2px);
}

.aurora-glow span{
    position:absolute;
    border-radius:50%;
    filter:blur(70px);
    opacity:.55;
    animation:auroraDrift 22s ease-in-out infinite;
}

.aurora-glow span:nth-child(1){
    width:52vw; height:52vw;
    left:-14vw; bottom:-18vh;
    background:radial-gradient(circle, rgba(120,140,255,.30), transparent 70%);
    animation-duration:26s;
}

.aurora-glow span:nth-child(2){
    width:40vw; height:40vw;
    right:-10vw; top:-14vh;
    background:radial-gradient(circle, rgba(185,166,255,.24), transparent 70%);
    animation-duration:20s;
    animation-delay:-6s;
}

.aurora-glow span:nth-child(3){
    width:34vw; height:34vw;
    right:6vw; bottom:-16vh;
    background:radial-gradient(circle, rgba(120,220,255,.14), transparent 72%);
    animation-duration:24s;
    animation-delay:-11s;
}

@keyframes auroraDrift{
    0%,100%{ transform:translate(0,0) scale(1); }
    33%{ transform:translate(3vw,-2vh) scale(1.06); }
    66%{ transform:translate(-2vw,3vh) scale(.97); }
}

/* ===================== COSMIC DUST ===================== */

.cosmic-dust{
    position:fixed;
    inset:0;
    z-index:1;
    pointer-events:none;
    transform:translate(calc(var(--px) * -0.6), calc(var(--py) * -0.6));
    transition:transform .5s ease-out;
}

.dust{
    position:absolute;
    width:var(--s, 2px);
    height:var(--s, 2px);
    border-radius:50%;
    background:#fff;
    box-shadow:0 0 6px 1px rgba(255,255,255,.6);
    opacity:0;
    animation:dustFloat var(--dur, 12s) ease-in-out infinite;
    animation-delay:var(--del, 0s);
}

@keyframes dustFloat{
    0%{ transform:translateY(0) translateX(0); opacity:0; }
    10%{ opacity:var(--op, .55); }
    50%{ transform:translateY(-38px) translateX(10px); opacity:var(--op, .55); }
    90%{ opacity:0; }
    100%{ transform:translateY(-70px) translateX(-6px); opacity:0; }
}

/* ===================== GLASS PRISM ===================== */

.glass-prism{
    position:fixed;
    right:6%;
    bottom:9%;
    z-index:1;
    width:min(150px, 16vw);
    pointer-events:none;
    opacity:.8;
    transform:translate(calc(var(--px) * 0.5), calc(var(--py) * 0.5));
    transition:transform .5s ease-out;
    animation:prismFloat 10s ease-in-out infinite;
}

@keyframes prismFloat{
    0%,100%{ transform:translate(calc(var(--px) * 0.5), calc(var(--py) * 0.5)) translateY(0) rotate(0deg); }
    50%{ transform:translate(calc(var(--px) * 0.5), calc(var(--py) * 0.5)) translateY(-10px) rotate(2deg); }
}

@media(max-width:768px){
    .glass-prism{ display:none; }
}

/* ===================== BACKGROUND π (decorative, behind everything) ===================== */
/* a large, soft glass π sitting deep in the background — same lavender-purple
   glass language as the side glyphs, but kept faint and out of the way so it
   never competes with the actual UI on top of it */

.bg-pi{
    position:fixed;
    inset:0;
    z-index:1;
    display:flex;
    align-items:center;
    justify-content:center;
    pointer-events:none;
    opacity:.16;
    mix-blend-mode:screen;
    filter:drop-shadow(0 30px 90px rgba(185,166,255,.22));
}

.bg-pi-parallax{
    width:min(62vw, 820px);
    height:min(62vw, 820px);
    transform:translate(calc(var(--px) * 0.35), calc(var(--py) * 0.25));
    transition:transform .6s ease-out;
    animation:bgPiFloat 22s ease-in-out infinite;
}

@keyframes bgPiFloat{
    0%,100%{ transform:translate(calc(var(--px) * 0.35), calc(var(--py) * 0.25)) translateY(0) rotate(0deg); }
    50%{ transform:translate(calc(var(--px) * 0.35), calc(var(--py) * 0.25)) translateY(-14px) rotate(.6deg); }
}

.bg-pi-parallax svg{
    width:100%;
    height:100%;
    overflow:visible;
}

.bg-pi-shine{
    transform:translateX(var(--shine, 30px));
    transition:transform .5s ease-out;
}

@media(max-width:1180px){
    .bg-pi-parallax{ width:min(72vw, 680px); height:min(72vw, 680px); }
}

@media(max-width:768px){
    .bg-pi{ opacity:.11; }
    .bg-pi-parallax{ width:min(90vw, 480px); height:min(90vw, 480px); }
}

.page{
    position:relative;
    z-index:2;

    width:100%;
    min-height:100%;
    min-height:100dvh;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:56px;

    text-align:center;

    /* the whole homepage tilts a touch toward the cursor, like a slab of
       glass being gently turned in the light */
    perspective:1600px;
    transform:
    rotateX(var(--tiltY))
    rotateY(var(--tiltX));
    transition:transform .5s cubic-bezier(.4,0,.2,1);
    will-change:transform;
}

/* ===================== HERO ===================== */

.brand{
    font-family:var(--font-display);
    font-size:14px;
    font-weight:700;
    letter-spacing:7px;
    text-transform:uppercase;
    color:var(--lavender-soft);
    text-shadow:0 0 18px var(--lavender-glow);
    margin-bottom:14px;
}

.brand .accent-letter{
    background:linear-gradient(160deg, #ffffff 0%, #ffffff 42%, var(--lavender) 58%, var(--lavender) 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    text-shadow:none;
    filter:drop-shadow(0 0 10px var(--lavender-glow));
}

.headline{
    font-family:var(--font-display);
    font-size:clamp(32px, 5vw, 56px);
    font-weight:800;
    letter-spacing:.2px;
    line-height:1.15;

    color:rgba(255,255,255,.94);

    filter:drop-shadow(0 2px 20px rgba(185,166,255,.2));
}

.subline{
    margin-top:16px;
    font-size:16px;
    color:rgba(255,255,255,.65);
    max-width:520px;
    margin-left:auto;
    margin-right:auto;
    line-height:1.6;
}

/* ===================== SUBJECT CARDS ===================== */

.subjects{
    display:grid;
    grid-template-columns:repeat(3, 220px);
    gap:22px;
    justify-content:center;
}

.subjects-section{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:22px;
    width:100%;
}

.subject-card{
    position:relative;

    width:220px;
    padding:34px 24px;

    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;

    text-decoration:none;
    color:#fff;

    background:linear-gradient(160deg, var(--glass-strong), var(--glass));
    backdrop-filter:blur(24px) saturate(180%);
    -webkit-backdrop-filter:blur(24px) saturate(180%);

    border:1px solid var(--glass-border);
    border-radius:22px;

    box-shadow:
    0 14px 40px rgba(0,0,0,.55),
    0 0 26px rgba(185,166,255,.07),
    inset 0 1px 1px rgba(255,255,255,.12);

    cursor:pointer;
    touch-action:manipulation;

    overflow:hidden;

    transition:transform .35s cubic-bezier(.4,0,.2,1), box-shadow .35s ease, border-color .35s ease, opacity .35s ease;
}

.subject-card::before{
    content:"";
    position:absolute;
    width:140px;
    height:140px;
    top:-70px;
    right:-50px;
    background: radial-gradient(circle, rgba(255,248,232,.24), transparent 70%);
    pointer-events:none;
}

.subject-card>*{ position:relative; z-index:2; }

.subject-card:hover,
.subject-card:focus-visible{
    transform:translateY(-6px);
    border-color:rgba(185,166,255,.55);
    box-shadow:
    0 22px 55px rgba(0,0,0,.55),
    0 0 40px var(--lavender-glow),
    inset 0 1px 1px rgba(255,255,255,.18);
    outline:none;
}

.subject-card.is-pressed,
.subject-card:active{
    transform:translateY(-2px) scale(.98);
    border-color:rgba(185,166,255,.5);
    box-shadow:
    0 10px 26px rgba(0,0,0,.5),
    0 0 30px var(--lavender-glow),
    inset 0 1px 1px rgba(255,255,255,.16);
}

.subject-icon{
    font-size:34px;
    filter:drop-shadow(0 0 12px var(--lavender-glow));
}

.subject-name{
    font-family:var(--font-display);
    font-size:19px;
    font-weight:700;
    letter-spacing:.3px;

    color:rgba(255,255,255,.94);
}

.badge{
    font-family:var(--font-display);
    margin-top:6px;
    padding:6px 16px;
    border-radius:999px;
    font-size:11px;
    font-weight:700;
    letter-spacing:1px;
    text-transform:uppercase;
}

.badge.soon{
    color:rgba(255,255,255,.55);
    border:1px solid rgba(255,255,255,.18);
    background:rgba(255,255,255,.03);
}

.badge.go{
    color:#0a0a12;
    background:linear-gradient(135deg, var(--lavender-soft), var(--lavender));
    box-shadow:0 0 22px var(--lavender-glow);
}

/* ===================== FAVORITE STAR ===================== */

.fav-btn{
    position:absolute;
    top:12px;
    right:12px;
    z-index:3;

    width:30px;
    height:30px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.16);
    border-radius:50%;

    color:rgba(255,255,255,.55);
    cursor:pointer;

    transition:transform .25s cubic-bezier(.4,0,.2,1), background .25s ease, border-color .25s ease, color .25s ease;
}

.fav-btn:hover{
    transform:scale(1.1);
    color:rgba(255,255,255,.85);
    border-color:rgba(185,166,255,.5);
}

.fav-btn:active{ transform:scale(.92); }

.fav-btn svg{ width:15px; height:15px; }

.fav-btn .fav-star-fill{
    opacity:0;
    transition:opacity .25s ease;
}

.fav-btn.is-fav{
    background:rgba(185,166,255,.16);
    border-color:rgba(185,166,255,.7);
    color:var(--lavender-soft);
}

.fav-btn.is-fav .fav-star-fill{ opacity:1; }

.fav-btn.is-fav svg{
    filter:drop-shadow(0 0 6px var(--lavender-glow));
}

/* clear visual indication a subject is favorited, without altering the
   card's existing design language */
.subject-card.is-favorite{
    border-color:rgba(185,166,255,.55);
    box-shadow:
    0 14px 40px rgba(0,0,0,.55),
    0 0 30px var(--lavender-glow),
    inset 0 1px 1px rgba(255,255,255,.16);
}

.subject-card.is-favorite .subject-icon{
    filter:drop-shadow(0 0 16px var(--lavender-glow));
}

/* subjects hidden while the section is collapsed */
.subject-card.is-collapsed-hidden{
    display:none;
}

/* Show More reveal: starts here, then eases to the card's normal
   opacity/transform via .subject-card's own transition */
.subject-card.is-revealing{
    opacity:0;
    transform:translateY(10px) scale(.97);
}

/* Show Less collapse: eases here first, then is-collapsed-hidden
   (display:none) is applied once the transition finishes */
.subject-card.is-hiding{
    opacity:0;
    transform:translateY(6px) scale(.97);
    pointer-events:none;
}

/* ===================== SHOW MORE / SHOW LESS ===================== */

.subjects-more-wrap{
    width:100%;
    display:flex;
    justify-content:center;
    margin-top:6px;
}

.show-more-btn{
    display:inline-flex;
    align-items:center;
    gap:8px;

    padding:12px 26px;

    font-family:var(--font-display);
    font-size:13px;
    font-weight:700;
    letter-spacing:.4px;
    color:#fff;

    background:linear-gradient(160deg, var(--glass-strong), var(--glass));
    backdrop-filter:blur(20px) saturate(170%);
    -webkit-backdrop-filter:blur(20px) saturate(170%);

    border:1px solid var(--glass-border);
    border-radius:999px;

    box-shadow:
    0 10px 30px rgba(0,0,0,.45),
    inset 0 1px 1px rgba(255,255,255,.14);

    cursor:pointer;

    transition:transform .3s cubic-bezier(.4,0,.2,1), box-shadow .3s ease, border-color .3s ease;
}

.show-more-btn:hover,
.show-more-btn:focus-visible{
    transform:translateY(-3px);
    border-color:rgba(185,166,255,.55);
    box-shadow:
    0 16px 40px rgba(0,0,0,.5),
    0 0 26px var(--lavender-glow),
    inset 0 1px 1px rgba(255,255,255,.18);
    outline:none;
}

.show-more-btn:active{
    transform:translateY(0) scale(.97);
}

.show-more-btn .chevron{
    transition:transform .3s cubic-bezier(.4,0,.2,1);
}

.show-more-btn.is-expanded .chevron{
    transform:rotate(180deg);
}

/* ===================== "COMING SOON" OVERLAY ===================== */

.soon-overlay{
    position:fixed;
    inset:0;
    z-index:40;

    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;

    background:rgba(2,2,3,.7);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);

    opacity:0;
    pointer-events:none;
    transition:opacity .3s ease;
}

.soon-overlay.show{
    opacity:1;
    pointer-events:auto;
}

.soon-card{
    position:relative;
    width:min(90vw, 340px);
    padding:38px 28px;
    text-align:center;

    background:linear-gradient(160deg, var(--glass-strong), var(--glass));
    backdrop-filter:blur(24px) saturate(160%);
    -webkit-backdrop-filter:blur(24px) saturate(160%);

    border:1px solid var(--glass-border);
    border-radius:24px;

    box-shadow:0 24px 60px rgba(0,0,0,.6), 0 0 40px var(--lavender-glow);
}

.soon-card h3{
    font-family:var(--font-display);
    font-size:22px;
    font-weight:700;
    letter-spacing:.2px;
    margin-bottom:10px;
    background:linear-gradient(135deg, #fff 0%, var(--lavender-soft) 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}

.soon-card p{
    font-size:14px;
    color:rgba(255,255,255,.6);
    line-height:1.6;
}

.soon-close{
    position:absolute;
    top:14px;
    right:14px;

    width:30px;
    height:30px;
    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:rgba(255,255,255,.06);
    border:1px solid var(--glass-border);
    color:#fff;
    cursor:pointer;
    font-size:13px;

    transition:transform .2s cubic-bezier(.4,0,.2,1), background .2s ease, border-color .2s ease;
}

.soon-close:hover{
    background:rgba(255,255,255,.12);
    border-color:rgba(185,166,255,.5);
}

.soon-close:active{
    transform:scale(.9);
}

/* ===================== SIDE 3D GLASS MODELS ===================== */

.side-model{
    position:fixed;
    top:50%;
    z-index:2;
    transform:translateY(-50%);
    perspective:1400px;
    pointer-events:none;
}

.side-model.model-left{ left:clamp(0px, 2vw, 40px); }
.side-model.model-right{ right:clamp(0px, 2vw, 40px); }

/* subtle cursor parallax on top of the ambient float — a separate wrapper so
   it never fights with the keyframe animations underneath it */
.model-parallax{
    transform:translate(calc(var(--px) * 0.8), calc(var(--py) * 0.6));
    transition:transform .5s ease-out;
}

.model-float{
    animation:modelFloat 7s ease-in-out infinite;
}

.model-right .model-float{ animation-delay:0s; }
.model-left .model-float{ animation-delay:.6s; }

@keyframes modelFloat{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-18px); }
}

.model-3d{
    position:relative;
    width:min(240px, 20vw);
    height:min(240px, 20vw);
    transform-style:preserve-3d;
    animation:modelTilt 10s ease-in-out infinite;
    filter:drop-shadow(0 30px 60px rgba(0,0,0,.6));
}

.model-left .model-3d{ animation-delay:.3s; }

/* DNA glyph is intentionally a touch smaller than the atom glyph opposite it */
.dna-3d{
    width:min(195px, 16vw) !important;
    height:min(195px, 16vw) !important;
}

@keyframes modelTilt{
    0%,100%{ transform:rotateY(-10deg) rotateX(5deg); }
    50%{ transform:rotateY(10deg) rotateX(-3deg); }
}

/* ===== freestanding glass glyph (no plate, no label — just the object,
   the way the reference art renders the glass pi / glass cube) ===== */

.glass-glyph{
    position:absolute;
    inset:0;
    transform:translateZ(20px);
}

.glass-glyph svg{
    width:100%;
    height:100%;
    overflow:visible;
}

<script>
(function(){
    var root = document.documentElement;
    var lastX = window.innerWidth * 0.5;
    var lastY = window.innerHeight * 0.26;

    function setLight(x, y){
        var w = window.innerWidth, h = window.innerHeight;

        // normalized -1..1 offsets, used for the gentle parallax drift on
        // the glass glyphs / prism / dust — where the light "falls"
        var nx = (x / w - 0.5) * 2;
        var ny = (y / h - 0.5) * 2;
        root.style.setProperty('--px', (nx * 14).toFixed(2) + 'px');
        root.style.setProperty('--py', (ny * 10).toFixed(2) + 'px');

        // whole-page tilt — subtle, like the page is a slab of glass
        // turning slightly toward the cursor
        root.style.setProperty('--tiltX', (nx * 2.2).toFixed(2) + 'deg');
        root.style.setProperty('--tiltY', (ny * -1.6).toFixed(2) + 'deg');

        // specular highlight position sweeping across the glass glyphs —
        // in SVG user units (0..230) so it tracks reliably across browsers
        var shine = -20 + ((x / w) * 250);
        root.style.setProperty('--shine', shine.toFixed(1) + 'px');
    }

    window.addEventListener('pointermove', function(e){
        lastX = e.clientX;
        lastY = e.clientY;
        setLight(lastX, lastY);
    }, { passive:true });

    window.addEventListener('touchstart', function(e){
        if(e.touches && e.touches[0]){
            lastX = e.touches[0].clientX;
            lastY = e.touches[0].clientY;
            setLight(lastX, lastY);
        }
    }, { passive:true });

    window.addEventListener('touchmove', function(e){
        if(e.touches && e.touches[0]){
            lastX = e.touches[0].clientX;
            lastY = e.touches[0].clientY;
            setLight(lastX, lastY);
        }
    }, { passive:true });

    setLight(lastX, lastY);

    // sparse floating cosmic dust — generated once, positions randomized
    // so no two particles drift the same way
    var dustHost = document.getElementById('cosmicDust');
    if(dustHost){
        var COUNT = 16;
        var frag = document.createDocumentFragment();
        for(var i = 0; i < COUNT; i++){
            var d = document.createElement('span');
            d.className = 'dust';
            d.style.left = (Math.random() * 100).toFixed(2) + '%';
            d.style.top = (20 + Math.random() * 70).toFixed(2) + '%';
            d.style.setProperty('--s', (1 + Math.random() * 1.6).toFixed(1) + 'px');
            d.style.setProperty('--dur', (9 + Math.random() * 10).toFixed(1) + 's');
            d.style.setProperty('--del', (Math.random() * -18).toFixed(1) + 's');
            d.style.setProperty('--op', (0.3 + Math.random() * 0.4).toFixed(2));
            frag.appendChild(d);
        }
        dustHost.appendChild(frag);
    }
})();
</script>
