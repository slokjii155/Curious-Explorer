<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visual Chemistry Explorer</title>

<style>

:root{
    --accent:#00d4ff;
    --accent-2:#7df9ff;
    --accent-deep:#0090c9;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:"Segoe UI", Arial, sans-serif;
    color:white;

    background:
    radial-gradient(circle at 20% 15%, rgba(0,212,255,.14), transparent 55%),
    radial-gradient(circle at 85% 80%, rgba(0,144,201,.14), transparent 55%),
    #050816;

    display:flex;
    align-items:center;
    justify-content:center;

    position:relative;
}

/* ambient floating orbs */
.bg-orb{
    position:absolute;
    border-radius:50%;
    filter:blur(4px);
    opacity:.55;
    animation: drift 10s ease-in-out infinite;
    pointer-events:none;
}
.bg-orb.o1{ width:14px; height:14px; top:18%; left:12%; background:var(--accent); box-shadow:0 0 20px var(--accent); animation-duration:9s; }
.bg-orb.o2{ width:9px; height:9px; top:70%; left:20%; background:var(--accent-2); box-shadow:0 0 16px var(--accent-2); animation-duration:12s; animation-delay:1s; }
.bg-orb.o3{ width:11px; height:11px; top:25%; left:82%; background:var(--accent); box-shadow:0 0 18px var(--accent); animation-duration:11s; animation-delay:2s; }
.bg-orb.o4{ width:7px; height:7px; top:78%; left:78%; background:var(--accent-2); box-shadow:0 0 14px var(--accent-2); animation-duration:8s; animation-delay:.5s; }
.bg-orb.o5{ width:6px; height:6px; top:50%; left:6%; background:var(--accent-deep); box-shadow:0 0 12px var(--accent); animation-duration:13s; }
.bg-orb.o6{ width:8px; height:8px; top:8%; left:55%; background:var(--accent-2); box-shadow:0 0 14px var(--accent-2); animation-duration:10s; animation-delay:1.5s; }

@keyframes drift{
    0%,100%{ transform:translateY(0) translateX(0); }
    50%{ transform:translateY(-26px) translateX(10px); }
}

/* ================= Home Card ================= */

.home-card{
    position:relative;
    z-index:2;
    width:min(560px, 90vw);
    padding:56px 44px 48px;
    text-align:center;

    background:
    linear-gradient(145deg, rgba(255,255,255,.16), rgba(9,18,38,.62) 45%, rgba(5,10,24,.78));

    backdrop-filter: blur(30px) saturate(180%);
    -webkit-backdrop-filter: blur(30px) saturate(180%);

    border:1px solid rgba(0,212,255,.5);
    border-top:1px solid rgba(255,255,255,.6);
    border-radius:32px;

    box-shadow:
    0 40px 100px rgba(0,0,0,.75),
    0 0 60px rgba(0,212,255,.3),
    inset 0 1px 1px rgba(255,255,255,.4),
    inset 0 -30px 50px rgba(0,0,0,.35),
    inset 0 0 40px rgba(255,255,255,.06);

    overflow:hidden;
    animation: cardRise .9s cubic-bezier(.2,.8,.2,1) both;
}

@keyframes cardRise{
    from{ opacity:0; transform:translateY(30px) scale(.96); }
    to{ opacity:1; transform:translateY(0) scale(1); }
}

.home-card::before{
    content:"";
    position:absolute;
    width:280px;
    height:280px;
    top:-140px;
    left:-120px;
    background: radial-gradient(circle, rgba(255,255,255,.35), transparent 70%);
    pointer-events:none;
}

/* ================= 3D Atom Logo ================= */

.atom-stage{
    width:150px;
    height:150px;
    margin:0 auto 30px;
    perspective:700px;
    position:relative;
}

.atom-core{
    position:absolute;
    top:50%;
    left:50%;
    width:34px;
    height:34px;
    margin:-17px 0 0 -17px;
    border-radius:50%;

    background: radial-gradient(circle at 35% 30%, #ffffff, var(--accent-2) 45%, var(--accent-deep));
    box-shadow:
    0 0 30px var(--accent),
    0 10px 22px rgba(0,0,0,.5),
    inset 0 4px 8px rgba(255,255,255,.7),
    inset 0 -8px 14px rgba(0,60,90,.6);

    animation: pulseCore 2.6s ease-in-out infinite;
    z-index:3;
}

@keyframes pulseCore{
    0%,100%{ transform:scale(1); }
    50%{ transform:scale(1.12); }
}

.ring{
    position:absolute;
    top:50%;
    left:50%;
    width:150px;
    height:150px;
    margin:-75px 0 0 -75px;
    border-radius:50%;
    border:1.5px solid rgba(0,212,255,.55);
    box-shadow:0 0 18px rgba(0,212,255,.35), inset 0 0 18px rgba(0,212,255,.15);
    transform-style:preserve-3d;
}

.ring.r1{ transform:rotateX(75deg) rotateZ(0deg); animation:spin 6s linear infinite; }
.ring.r2{ transform:rotateX(75deg) rotateZ(60deg); animation:spin 8s linear infinite reverse; }
.ring.r3{ transform:rotateX(75deg) rotateZ(120deg); animation:spin 10s linear infinite; }

@keyframes spin{
    from{ transform:rotateX(75deg) rotateZ(var(--rot,0deg)) rotateY(0deg); }
    to{ transform:rotateX(75deg) rotateZ(var(--rot,0deg)) rotateY(360deg); }
}

.ring .e{
    position:absolute;
    width:10px;
    height:10px;
    border-radius:50%;
    top:50%;
    left:-5px;
    margin-top:-5px;

    background: radial-gradient(circle at 35% 30%, #ffffff, var(--accent-2));
    box-shadow:0 0 12px var(--accent), 0 0 20px var(--accent-2);
}

/* ================= Text ================= */

.home-card h1{
    font-size:34px;
    font-weight:800;
    letter-spacing:1.5px;
    margin-bottom:10px;

    background: linear-gradient(135deg, #ffffff 0%, var(--accent-2) 55%, var(--accent) 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;

    filter: drop-shadow(0 2px 3px rgba(0,0,0,.5));
}

.home-card p.tagline{
    font-size:15.5px;
    color:rgba(255,255,255,.72);
    line-height:1.6;
    max-width:420px;
    margin:0 auto 34px;
}

/* ================= Feature chips ================= */

.features{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:36px;
}

.chip{
    font-size:12.5px;
    padding:7px 14px;
    border-radius:999px;
    color:rgba(255,255,255,.8);

    background: rgba(0,212,255,.08);
    border:1px solid rgba(0,212,255,.35);
    box-shadow: inset 0 1px 1px rgba(255,255,255,.15);
}

/* ================= Launch Button ================= */

.launch-btn{
    position:relative;
    display:inline-flex;
    align-items:center;
    gap:10px;
    padding:16px 38px;

    font-size:16px;
    font-weight:700;
    letter-spacing:.5px;
    color:#04121c;
    text-decoration:none;

    border-radius:999px;
    border:1px solid rgba(255,255,255,.5);

    background: linear-gradient(145deg, var(--accent-2), var(--accent) 55%, var(--accent-deep));

    box-shadow:
    0 16px 34px rgba(0,144,201,.45),
    0 6px 14px rgba(0,0,0,.4),
    inset 0 2px 3px rgba(255,255,255,.85),
    inset 0 -10px 16px rgba(0,60,90,.45);

    transition: transform .25s ease, box-shadow .25s ease;
    overflow:hidden;
}

.launch-btn::before{
    content:"";
    position:absolute;
    top:0; left:0; right:0;
    height:50%;
    background: linear-gradient(180deg, rgba(255,255,255,.55), rgba(255,255,255,0));
    pointer-events:none;
}

.launch-btn:hover{
    transform: translateY(-4px) scale(1.03);
    box-shadow:
    0 22px 44px rgba(0,144,201,.55),
    0 8px 18px rgba(0,0,0,.45),
    inset 0 2px 3px rgba(255,255,255,.9),
    inset 0 -10px 16px rgba(0,60,90,.45);
}

.launch-btn:active{
    transform: translateY(-1px) scale(.99);
}

.launch-btn .arrow{
    transition: transform .25s ease;
}

.launch-btn:hover .arrow{
    transform: translateX(5px);
}

.footnote{
    margin-top:22px;
    font-size:12px;
    color:rgba(255,255,255,.4);
    letter-spacing:.5px;
}

@media(max-width:520px){
    .home-card{ padding:44px 26px 36px; }
    .home-card h1{ font-size:26px; }
}

</style>

</head>

<body>

<div class="bg-orb o1"></div>
<div class="bg-orb o2"></div>
<div class="bg-orb o3"></div>
<div class="bg-orb o4"></div>
<div class="bg-orb o5"></div>
<div class="bg-orb o6"></div>

<div class="home-card">

    <div class="atom-stage">
        <div class="ring r1"><div class="e"></div></div>
        <div class="ring r2"><div class="e"></div></div>
        <div class="ring r3"><div class="e"></div></div>
        <div class="atom-core"></div>
    </div>

    <h1>Visual Chemistry Explorer</h1>

    <p class="tagline">
        Journey inside the atom. Explore Bohr and Quantum Orbital models
        in a stunning interactive 3D universe, built for curious minds.
    </p>

    <div class="features">
        <span class="chip">⚛ Bohr Model</span>
        <span class="chip">☁ Quantum Orbitals</span>
        <span class="chip">🧬 Full Periodic Table</span>
    </div>

    <a class="launch-btn" href="./explorer.html">
        Enter Explorer <span class="arrow">→</span>
    </a>

    <div class="footnote">Click above to launch the 3D atomic simulator</div>

</div>

</body>
</html>
